name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: widget_platform_test
          POSTGRES_USER: widget
          POSTGRES_PASSWORD: widget
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U widget -d widget_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://widget:widget@localhost:5432/widget_platform_test
      DATABASE_URL: postgres://widget:widget@localhost:5432/widget_platform_test
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Run PostgreSQL integration tests
        run: npm test
      - name: Audit production dependencies
        run: npm audit --audit-level=high
