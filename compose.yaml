name: flyrank-widget-platform
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: widget_platform
      POSTGRES_USER: widget
      POSTGRES_PASSWORD: widget
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U widget -d widget_platform"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      DATABASE_URL: postgres://widget:widget@db:5432/widget_platform
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-change-me-to-a-long-random-secret}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-10}
      RATE_LIMIT_PER_WIDGET_MAX: ${RATE_LIMIT_PER_WIDGET_MAX:-100}
      BODY_LIMIT: ${BODY_LIMIT:-10kb}
      GEO_TIMEOUT_MS: ${GEO_TIMEOUT_MS:-2500}
      NOTIFICATION_POLL_MS: ${NOTIFICATION_POLL_MS:-1000}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-3}
      NOTIFICATION_BASE_DELAY_MS: ${NOTIFICATION_BASE_DELAY_MS:-1000}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    init: true
    restart: unless-stopped

volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U widget -d widget_platform"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      DATABASE_URL: postgres://widget:widget@db:5432/widget_platform
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-change-me-to-a-long-random-secret}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-10}
      RATE_LIMIT_PER_WIDGET_MAX: ${RATE_LIMIT_PER_WIDGET_MAX:-100}
      BODY_LIMIT: ${BODY_LIMIT:-10kb}
      GEO_TIMEOUT_MS: ${GEO_TIMEOUT_MS:-2500}
      NOTIFICATION_POLL_MS: ${NOTIFICATION_POLL_MS:-1000}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-3}
      NOTIFICATION_BASE_DELAY_MS: ${NOTIFICATION_BASE_DELAY_MS:-1000}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    init: true
    restart: unless-stopped

  # Local mail catcher for the confirmation side effect (optional):
  #   docker compose up -d mailpit
  #   NOTIFICATION_TRANSPORT=smtp docker compose up -d --force-recreate app
  # Mailbox UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.20
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
